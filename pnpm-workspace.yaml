  '@vitejs/devtools': ^0.7.1
  '@vitejs/devtools-kit': ^0.7.1
  '@vue/compiler-core': ^3.5.42
  '@vue/compiler-dom': ^3.5.42
  '@vue/shared': ^3.5.42
  chokidar: ^5.0.0
  devframe: ^0.9.11
  esbuild: ^0.28.2
  markdown-exit: ^1.3.0
  rollup: ^4.63.1
  semver: ^7.8.5
  typescript: ^6.0.3
  unimport: ^6.4.0
  vite: ^8.2.2
  vue: ^3.5.42
  vue-sfc-transformer: ^0.3.0
  vue-tsc: ^3.3.11

patchedDependencies:
  nitro@3.0.260610-beta: patches/nitro@3.0.260610-beta.patch

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  json-editor-vue: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true

