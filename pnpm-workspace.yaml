ignoreWorkspaceRootCheck: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@devframes/hub'
  - '@devframes/json-render'
  - '@devframes/plugin-data-inspector'
  - '@devframes/plugin-code-server'
  - '@devframes/plugin-inspect'
  - '@devframes/plugin-messages'
  - '@devframes/plugin-terminals'
  - '@vitejs/devtools-kit'
  - '@vitejs/devtools'
  - devframe
  - vite-plugin-inspect@12.0.2
  - '@devframes/hub-ui'
  - '@devframes/json-render-ui'
  - '@devframes/service-open'
  - '@devframes/vite'
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - bumpp@12.3.0
  - pkg-types@2.3.2
  - tinyexec@1.3.1
  - vitest@5.0.0
  - db0@0.4.1
  - h3@2.0.1-rc.31
  - srvx@1.0.3

resolutionMode: highest

trustPolicy: no-downgrade
trustPolicyExclude:
  - 'tinyexec@1.2.0 || 1.2.1 || 1.2.2'

update:
  ignoreDeps:
    - typescript@7

autoInstallPeers: true
strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

packages:
  - packages/**
  - '!packages/*/package'
  - '!packages/*/package/**'
  - playgrounds/**
  - '!playgrounds/**/.output/**'

refs:
  devframe: &devframe ^0.9.11
  nuxt: &nuxt npm:nuxt-nightly@5.0.0-29806258.d070492f
  nuxt-kit: &nuxt-kit npm:@nuxt/kit-nightly@5.0.0-29806258.d070492f
  nuxt-schema: &nuxt-schema npm:@nuxt/schema-nightly@5.0.0-29806258.d070492f
  shiki: &shiki ^4.4.3
  unocss: &unocss ^66.9.2
  vite: &vite ^8.2.2
  vite-devtools: &vite-devtools ^0.7.1
  vue: &vue ^3.5.42
  vueuse: &vueuse ^14.4.0

overrides:
  '@devframes/hub': ^0.9.11
  '@devframes/json-render': ^0.9.11
  '@devframes/plugin-code-server': ^0.9.11
  '@devframes/plugin-data-inspector': ^0.9.11
