    exsolve: ^1.1.1
    lightningcss: ^1.33.0
    # Nuxt 5 nightly's Nitro layer (`@nuxt/nitro-server-nightly`) builds on
    # the next-gen Nitro v3 engine (package `nitro`, not `nitropack`).
    # `@nuxt/devtools`/`@nuxt/devtools-kit` declare both as *optional* peer
    # dependencies (a consumer's Nuxt has exactly one or the other), but
    # still pin a devDependency here too so this monorepo's own build and
    # typecheck resolve a single, consistent version of each rather than
    # whatever `autoInstallPeers` would otherwise pick independently.
